<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Vocabularies - Visual Relations</title>

    <link
      rel="stylesheet"
      href="https://bootswatch.com/4/simplex/bootstrap.min.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/pv_config.js"></script>
    <script src="js/ws.js"></script>
    <script src="js/d3_data.js"></script>
    <script src="js/echarts.js"></script>
    <script src="js/echarts_tree.js"></script>

    <style>
      /* Custom styles for the layout */
      body {
        font-family:
          "Open Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol";
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #f8f9fa;
      }

      .main-content {
        flex-grow: 1;
        display: flex;
        align-items: stretch;
      }
    </style>

    <script>
      function onResize() {}
    </script>
  </head>
  <body onload="onResize()" onresize="onResize()">
    <!-- Main Section -->
    <main class="main-content">
      <div class="w-100 d-flex flex-column pt-2 text-center bg-white">
        <h5 id="stackContent" class=""></h5>
        <div id="divDiagram" class="w-100 h-100 flex-grow-1"></div>
        <div
          id="controls"
          class="w-100 border border-1 p-2 d-flex flex-column text-left"></div>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
      $(document).ready(function () {
        let vocProjects = new Map(); //key of vocProjects is identical with URI path!
        addVocProj(vocProjects); //-> var assigned in projects.js

        d3data.init(function (data, filteredData) {
          if (filteredData) data = filteredData;
          eCharts_tree(data, "divDiagram");
        }, 4);
      });
    </script>
  </body>
</html>
